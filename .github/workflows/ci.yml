name: CI

# The push and pull request gate: the same `npm run validate` developers run locally (CI-1).
# No emulator job: the tests are JVM unit tests, and device behaviour is checked on a phone before a
# release (D-052).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Cold Gradle caches dominate the first run; later runs are much shorter.
    timeout-minutes: 45
    env:
      # scripts/dev/gradle runs ./gradlew directly when CI is set (the runner has the memory).
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The dev tools (the icon generator) are locked in package-lock.json.
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Must match the JDK in docs/development.md and the Java 17 target in both build.gradle files.
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      # Gradle's dependency and wrapper caches, so a run downloads only what changed (CI-6). Without
      # it every run pulls the whole Kotlin, AGP and AndroidX tree from Maven Central, which
      # rate-limits shared CI addresses (429). `basic` is the open-source provider on the GitHub
      # Actions cache. Only main writes the cache; pull requests restore it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # Explicit, so a runner image without the platform can't fail the build. compileSdk 37 is the
      # android-37.0 package. Must match compileSdk in android/companion/build.gradle and android/lock/build.gradle.
      - name: Install SDK platform 37
        run: sdkmanager "platforms;android-37.0"
      - name: Validate
        run: npm run validate
