plugins {
    id 'com.android.application'
}

// Keystore passwords live with the keystore in secrets/ (git-ignored), not in this public file.
def signing = new Properties()
def signingFile = rootProject.file('secrets/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'home.phonelock'
    compileSdk 37

    defaultConfig {
        applicationId 'home.phonelock'
        minSdk 33
        targetSdk 36
        versionCode rootProject.ext.gitVersionCode
        versionName "1.0.${rootProject.ext.gitVersionCode}"
    }

    signingConfigs {
        // Debug builds use the committed debug-only key (keystore/debug.keystore, standard "android" passwords),
        // so every machine and container signs them the same way and reinstalls work (DIST-8). It is not a secret.
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Our own key, kept with the project so future updates install over the top.
        lock {
            storeFile file('../secrets/phonelock.keystore')
            storePassword signing.getProperty('storePassword')
            keyAlias 'phonelock'
            keyPassword signing.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lock
        }
        // The production key signs release builds only (SEC-11).
        // Signed with the debug key, a debug lock app cannot update over a release one, or take its updates.
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // Every language must have every string, and the same placeholders, before a release builds
    // (release builds run these checks; see README "Languages").
    lint {
        fatal 'MissingTranslation', 'ExtraTranslation', 'StringFormatInvalid', 'StringFormatCount',
            'StringFormatMatches', 'MissingQuantity', 'UnusedQuantity'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The lock app is plain Java. AGP 9 compiles Kotlin in every module and adds the Kotlin standard library
// (2 MB), which this app never uses, so leave it out: smaller downloads for setup and self-updates.
// Only the app's own classpaths: build tools such as lint still need it.
configurations.matching { it.name.endsWith('RuntimeClasspath') || it.name.endsWith('CompileClasspath') }.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
}

dependencies {
    // Tests only, never shipped.
    testImplementation 'junit:junit:4.13.2'
}
